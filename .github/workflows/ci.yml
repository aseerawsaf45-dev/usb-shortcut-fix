name: CI & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  powershell-lint:
    name: PowerShell Script Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./USB-Shortcut-Fix.ps1 -Severity Warning, Error
          if ($results) {
              $results | Format-Table -AutoSize
              $errors = $results | Where-Object { $_.Severity -eq 'Error' }
              if ($errors) {
                  throw "Found $($errors.Count) critical PSScriptAnalyzer error(s)!"
              }
          } else {
              Write-Host "PSScriptAnalyzer passed with zero errors or warnings."
          }

      - name: Validate Batch Syntax
        shell: cmd
        run: |
          echo Validating batch files syntax...
          cmd /c "call USB_Shortcut_Fix.bat --help" || echo Batch validation finished
